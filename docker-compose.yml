services:
  postgres:
    image: postgres:18
    volumes: 
        - postgres_data:/var/lib/postgresql
    environment:
        POSTGRES_USER: ${POSTGRESUSER}
        POSTGRES_PASSWORD: ${POSTGRESPASSWORD}
        POSTGRES_DB: ${POSTGRESDB}  
    ports:
        - "5432:5432"
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 15s
  rabbitmq:
    image: rabbitmq:4
    container_name: rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQDEFAULTUSER} 
      RABBITMQ_DEFAULT_PASS: ${RABBITMQDEFAULTPASS} 
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
  # Ponto único de entrada. Modo DB-less: as rotas vêm de kong/kong.yml, não de
  # um banco. Só o Kong publica porta HTTP no host — a API ficou para dentro.
  kong:
    image: kong:3.9
    container_name: rastreador-gateway
    restart: on-failure
    depends_on:
      rastreador:
        condition: service_healthy
    ports:
      # 8000 = proxy (o que o mundo usa). 8001 = Admin API, presa no localhost
      # porque quem alcança a Admin API reconfigura o gateway inteiro.
      - "8000:8000"
      - "127.0.0.1:8001:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong:/kong:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  rastreador:
    build:
      context: .
      dockerfile: Bootstrap/Dockerfile
    container_name: rastreador-app
    restart: on-failure
    # Sem `ports`: a API só é alcançável pela rede interna do compose, via Kong.
    # Para depurar direto nela de novo, devolva `ports: ["5250:8080"]` aqui.
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=${POSTGRESDB};Username=${POSTGRESUSER};Password=${POSTGRESPASSWORD};
      - RabbitMq__Host=rabbitmq
      - RabbitMq__User=${RABBITMQDEFAULTUSER}
      - RabbitMq__Password=${RABBITMQDEFAULTPASS}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  scraper:
    build:
      context: .
      dockerfile: RastreadorDePreco.Scraper/Dockerfile
    container_name: rastreador-scraper
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - DOTNET_ENVIRONMENT=Development
      - RabbitMq__Host=rabbitmq
      - RabbitMq__User=${RABBITMQDEFAULTUSER}
      - RabbitMq__Password=${RABBITMQDEFAULTPASS}
    healthcheck:
      # Worker não fala HTTP, então não há endpoint para chamar. O serviço toca
      # /tmp/healthy a cada 15s enquanto a conexão com o RabbitMQ estiver aberta;
      # aqui a gente só confere se esse carimbo é recente. Arquivo velho = travado.
      test: ["CMD-SHELL", "find /tmp/healthy -mmin -1 | grep -q ."]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s
  notificador:
    build:
      context: .
      dockerfile: RastreadorDePreco.Notificador/Dockerfile
    container_name: rastreador-notificador
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - DOTNET_ENVIRONMENT=Development
      - RabbitMq__Host=rabbitmq
      - RabbitMq__User=${RABBITMQDEFAULTUSER}
      - RabbitMq__Password=${RABBITMQDEFAULTPASS}
      - Notificacao__Destinatario=${NOTIFICACAODESTINATARIO:-voce@exemplo.com}
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/healthy -mmin -1 | grep -q ."]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."

volumes:
  postgres_data:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local  