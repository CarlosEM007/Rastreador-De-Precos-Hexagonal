services:
  postgres:
    image: postgres:18
    volumes: 
        - postgres_data:/var/lib/postgresql
    environment:
        POSTGRES_USER: ${POSTGRESUSER}
        POSTGRES_PASSWORD: ${POSTGRESPASSWORD}
        POSTGRES_DB: ${POSTGRESDB}  
    ports:
        - "5432:5432"
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 15s
  rabbitmq:
    image: rabbitmq:4
    container_name: rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQDEFAULTUSER} 
      RABBITMQ_DEFAULT_PASS: ${RABBITMQDEFAULTPASS} 
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
  rastreador:
    build:
      context: .
      dockerfile: Bootstrap/Dockerfile
    container_name: rastreador-app
    ports:
    - 5250:8080
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=${POSTGRESDB};Username=${POSTGRESUSER};Password=${POSTGRESPASSWORD};
      - RabbitMq__Host=rabbitmq
      - RabbitMq__User=${RABBITMQDEFAULTUSER}
      - RabbitMq__Password=${RABBITMQDEFAULTPASS}
  scraper:
    build:
      context: .
      dockerfile: RastreadorDePreco.Scraper/Dockerfile
    container_name: rastreador-scraper
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - DOTNET_ENVIRONMENT=Development
      - RabbitMq__Host=rabbitmq
      - RabbitMq__User=${RABBITMQDEFAULTUSER}
      - RabbitMq__Password=${RABBITMQDEFAULTPASS}

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."

volumes:
  postgres_data:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local  